<div class="table-wrap"><table><thead><tr><th>SKU no Mercado Livre</th><th>Largura</th><th>Altura</th><th>Profundidade</th><th>Peso bruto</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.sku }}<small>{{ row.mlb }} · {{ row.title }}</small></td><td>{{ row.width }}</td><td>{{ row.height }}</td><td>{{ row.depth }}</td><td>{{ row.weight }}</td></tr>{% else %}<tr><td colspan="5" class="empty">Nenhuma medida importada para esta busca.</td></tr>{% endfor %}</tbody></table></div>
